<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Оператор очереди</title>
<style>
  :root { --bg:#eef1f5; --ink:#14213d; --muted:#5b6478; --ok:#0b6e4f; --card:#fff; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding:16px; }
  main { width:100%; max-width:420px; background:var(--card); border-radius:16px; padding:28px 24px; text-align:center;
         box-shadow:0 1px 3px rgba(20,33,61,.12); }
  h1 { font-size:20px; margin:0 0 16px; }
  input { width:100%; font:inherit; padding:12px; margin-bottom:10px; border:1px solid #c9d0dc; border-radius:10px; }
  button { width:100%; font:inherit; font-weight:600; padding:16px; border:0; border-radius:12px;
           background:var(--ink); color:#fff; cursor:pointer; }
  button.next { background:var(--ok); font-size:20px; padding:22px; margin:16px 0; }
  button.link { background:none; color:var(--muted); padding:8px; font-weight:400; text-decoration:underline; }
  button:focus-visible, input:focus-visible { outline:3px solid #7aa2ff; outline-offset:2px; }
  button:disabled { opacity:.6; }
  .num { font-size:88px; font-weight:800; line-height:1; letter-spacing:-2px; }
  .muted { color:var(--muted); }
  .row { display:flex; justify-content:space-between; padding:10px 0; border-top:1px solid #e3e7ee; }
  #qr { display:flex; justify-content:center; margin:12px 0 4px; }
  #qrUrl { font-size:13px; word-break:break-all; }
  .err { color:#b00020; margin-top:10px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <section id="login">
    <h1>Вход для оператора</h1>
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="pass" type="password" placeholder="Пароль" autocomplete="current-password">
    <button id="loginBtn">Войти</button>
  </section>

  <section id="panel" hidden>
    <h1>Очередь: <span id="slug"></span></h1>
    <div class="muted">Сейчас обслуживается</div>
    <div class="num" id="serving">–</div>
    <div class="row"><span>Ожидают</span><b id="waiting">–</b></div>
    <button class="next" id="nextBtn">Вызвать следующего</button>
    <div id="callMsg" class="muted"></div>

    <div class="row"><span>QR для клиентов</span></div>
    <div id="qr"></div>
    <div id="qrUrl" class="muted"></div>
    <button class="link" id="logoutBtn">Выйти</button>
  </section>

  <div class="err" id="err" hidden></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script>
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const slug = new URLSearchParams(location.search).get('q') || 'main';
const $ = id => document.getElementById(id);
let timer = null;

function showError(msg) { $('err').textContent = msg; $('err').hidden = !msg; }

async function refresh() {
  const { data, error } = await db.rpc('queue_overview', { p_slug: slug });
  if (error || !data || !data[0]) { showError('Очередь не найдена или нет связи.'); return; }
  showError('');
  $('serving').textContent = data[0].now_serving || '–';
  $('waiting').textContent = data[0].waiting;
}

function showPanel() {
  $('login').hidden = true; $('panel').hidden = false;
  $('slug').textContent = slug;
  const url = location.origin + '/?q=' + encodeURIComponent(slug);
  $('qr').innerHTML = '';
  new QRCode($('qr'), { text: url, width: 200, height: 200 });
  $('qrUrl').textContent = url;
  refresh();
  clearInterval(timer);
  timer = setInterval(refresh, 3000);
}

function showLogin() {
  clearInterval(timer);
  $('panel').hidden = true; $('login').hidden = false;
}

$('loginBtn').addEventListener('click', async () => {
  showError('');
  const { error } = await db.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pass').value });
  if (error) { showError('Неверный email или пароль.'); return; }
  showPanel();
});

$('logoutBtn').addEventListener('click', async () => { await db.auth.signOut(); showLogin(); });

$('nextBtn').addEventListener('click', async () => {
  $('nextBtn').disabled = true; showError('');
  const { data, error } = await db.rpc('call_next', { p_slug: slug });
  $('nextBtn').disabled = false;
  if (error) { showError('Не удалось вызвать. Войдите заново и повторите.'); return; }
  $('callMsg').textContent = data ? ('Вызван номер ' + data) : 'Очередь пуста';
  refresh();
});

db.auth.getSession().then(({ data }) => { if (data.session) showPanel(); });
</script>
</body>
</html>
