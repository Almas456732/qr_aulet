<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Michurino by Aulet</title>
<style>
  :root { --bg:#eef1f5; --ink:#14213d; --muted:#5b6478; --card:#fff; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding:16px; }
  main { width:100%; max-width:380px; background:var(--card); border-radius:16px; padding:28px 24px; text-align:center;
         box-shadow:0 1px 3px rgba(20,33,61,.12); }
  h1 { font-size:22px; margin:0 0 12px; }
  .muted { color:var(--muted); margin:0 0 20px; }
  .num { font-size:96px; font-weight:800; line-height:1; margin:8px 0 16px; letter-spacing:-2px; }
  button { width:100%; font:inherit; font-weight:600; padding:16px; border:0; border-radius:12px;
           background:var(--ink); color:#fff; cursor:pointer; }
  button:focus-visible { outline:3px solid #7aa2ff; outline-offset:2px; }
  button:disabled { opacity:.6; }
  .err { color:#b00020; margin-top:12px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Michurino by Aulet</h1>
  <p class="muted" id="sub"></p>

  <section id="join">
    <button id="takeBtn">Кезекке тұру</button>
  </section>

  <section id="ticket" hidden>
    <div class="muted">Сіздің кезек нөміріңіз</div>
    <div class="num" id="myNum">–</div>
    <p>Кезегіңізді күтіңіз.</p>
  </section>

  <div class="err" id="err" hidden></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const slug = new URLSearchParams(location.search).get('q') || 'main';
const KEY = 'ticket:' + slug;
const $ = id => document.getElementById(id);
const TXT_JOIN = 'Жоба бойынша кеңес алу үшін кезекке тіркелу батырмасын басыңыз.';
const TXT_TICKET = 'Сіз жоба бойынша кеңес алуға кезекке тіркелдіңіз.';
const TXT_DONE = 'Қызмет көрсету аяқталды. Рақмет!';
let timer = null;

function showError(msg) { $('err').textContent = msg; $('err').hidden = !msg; }
function saved() { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } }
function forget() { try { localStorage.removeItem(KEY); } catch {} }

function showJoin(text) {
  clearInterval(timer);
  $('join').hidden = false; $('ticket').hidden = true;
  $('sub').textContent = text || TXT_JOIN;
}

async function refresh(id) {
  const { data, error } = await db.rpc('get_ticket_status', { p_ticket_id: id });
  if (error) { showError('Байланыс жоқ. Қайта көреміз…'); return; }
  showError('');
  const r = data && data[0];
  if (!r || r.status === 'cancelled') { forget(); showJoin(); return; }
  if (r.status === 'done') { forget(); showJoin(TXT_DONE); return; }
  $('myNum').textContent = r.ticket_number;
}

function showTicket(id) {
  $('join').hidden = true; $('ticket').hidden = false;
  $('sub').textContent = TXT_TICKET;
  refresh(id);
  clearInterval(timer);
  timer = setInterval(() => refresh(id), 3000);
}

$('takeBtn').addEventListener('click', async () => {
  $('takeBtn').disabled = true; showError('');
  const { data, error } = await db.rpc('take_ticket', { p_slug: slug });
  $('takeBtn').disabled = false;
  if (error || !data || !data[0]) { showError('Кезекке тұру мүмкін болмады. Сілтемені тексеріңіз немесе қайталап көріңіз.'); return; }
  const id = data[0].ticket_id;
  try { localStorage.setItem(KEY, JSON.stringify({ id })); } catch {}
  $('myNum').textContent = data[0].ticket_number;
  showTicket(id);
});

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { const s = saved(); if (s && s.id) refresh(s.id); }
});

$('sub').textContent = TXT_JOIN;
const s = saved();
if (s && s.id) showTicket(s.id);
</script>
</body>
</html>
